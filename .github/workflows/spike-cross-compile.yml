name: Spike — cross-compile all release triples

# PURPOSE: de-risk the darwin bundled-C (sqlite3.c + sqlite-vec.c) cross-compile
# BEFORE any release work starts (RESEARCH Pitfall 1). The known failure modes
# (`TargetConditionals.h` not found, zig `-nostdinc`, zigbuild #316 iconv) must
# surface here, in a dispatchable spike, not at tag time. Plan 02-04 publishes
# the repo and runs this workflow as the release gate; if a darwin leg fails,
# the pre-approved Plan B (plain BLOB column + in-Rust brute-force cosine)
# replaces sqlite-vec before release.
#
# UnityInFlow org self-hosted runners ONLY — never ubuntu-latest (CLAUDE.md).
# cargo-zigbuild is host-arch-independent, so the single ARM64 orangepi runner
# cross-compiles all six triples serially (the Hetzner X64 fleet is
# intermittently offline — recurring ecosystem blocker, STATE.md carry-forward).
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Pinned toolchain for cargo-zigbuild cross-compilation. NEVER use "latest" —
  # zig <-> cargo-zigbuild compatibility is version-coupled.
  ZIG_VERSION: '0.14.1'
  CARGO_ZIGBUILD_VERSION: '0.23.0'

jobs:
  spike-build:
    name: zigbuild ${{ matrix.target }}
    runs-on: [orangepi]
    # Pitfall 1 gate: EVERY leg is loud. Unlike the injection-scanner release
    # template, there is NO experimental/continue-on-error anywhere — a darwin
    # failure is exactly the signal this spike exists to catch.
    continue-on-error: false
    strategy:
      # fail-fast disabled: surface ALL target failures in one dispatch.
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust stable + target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install pinned zig + cargo-zigbuild
        run: |
          # zig from the OFFICIAL ziglang.org tarball, host-arch-matched — the
          # self-hosted runners have no pip3 (mcp-hub 03-04 lesson). zig itself
          # cross-compiles to every target, so only the host arch matters here.
          # Pin BOTH versions — never `latest`.
          set -euo pipefail
          case "$(uname -m)" in
            aarch64|arm64) ZIG_ARCH=aarch64 ;;
            x86_64|amd64)  ZIG_ARCH=x86_64 ;;
            *) echo "unsupported host arch: $(uname -m)" >&2; exit 1 ;;
          esac
          # zig 0.14.0+ uses arch-first artifact naming: zig-<arch>-linux-<ver>.
          ZIG_DIR="zig-${ZIG_ARCH}-linux-${ZIG_VERSION}"
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/${ZIG_DIR}.tar.xz" -o /tmp/zig.tar.xz
          mkdir -p "$HOME/.zig" && tar -xJf /tmp/zig.tar.xz -C "$HOME/.zig"
          echo "$HOME/.zig/${ZIG_DIR}" >> "$GITHUB_PATH"
          "$HOME/.zig/${ZIG_DIR}/zig" version
          cargo install --locked --version "${CARGO_ZIGBUILD_VERSION}" cargo-zigbuild

      - name: Build (cargo zigbuild, cross-compiled from this Linux host)
        run: cargo zigbuild --release --locked --target ${{ matrix.target }} -p agent-memory

      - name: Smoke test (host-arch-aware --version; foreign-arch/darwin = presence-only)
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/agent-memory"
          test -f "$BIN" || { echo "ERROR: $BIN missing"; exit 1; }
          TARGET="${{ matrix.target }}"
          case "$TARGET" in
            *-apple-darwin)
              # A macOS binary is never natively executable on a Linux host.
              echo "apple-darwin build present -- presence-only (not executable on a Linux host)."
              ;;
            *)
              # Execute only when the target arch equals the runner arch —
              # `Exec format error` otherwise (RESEARCH Pitfall 7, mcp-hub
              # 03-04 precedent). Decide at runtime, never hardcode a triple.
              TARGET_ARCH="${TARGET%%-*}"            # x86_64 | aarch64
              HOST_ARCH="$(uname -m)"; [ "$HOST_ARCH" = "arm64" ] && HOST_ARCH=aarch64
              if [ "$TARGET_ARCH" = "$HOST_ARCH" ]; then
                "$BIN" --version
              else
                echo "Cross-built $TARGET_ARCH on $HOST_ARCH host -- presence-only."
              fi
              ;;
          esac
