name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Runner policy (Phase 3, D-12 / D-10): this repo is public and the org runner
# group enforces `allows_public_repositories: false` (OPS-02, enforced
# 2026-07-09), so self-hosted jobs can NEVER be picked up here. GitHub-hosted
# secretless CI is the sanctioned ecosystem D-02 exception and supersedes the
# inner CLAUDE.md's "never ubuntu-latest" for this repo.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace

      - name: Test (incl. stdout-purity + tools + ttl/decay/store)
        run: cargo test --workspace

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Coverage gate (>80% lines)
        run: cargo llvm-cov --workspace --fail-under-lines 80
